services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: barber_saas
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_password
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber_user -d barber_saas']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber-network

  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: barber_saas_test
      POSTGRES_USER: barber_test
      POSTGRES_PASSWORD: barber_test_password
    ports:
      - '${POSTGRES_TEST_HOST_PORT:-55434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber_test -d barber_saas_test']
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - barber-network

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${S3_ACCESS_KEY_ID:-cutg-local}'
      MINIO_ROOT_PASSWORD: '${S3_SECRET_ACCESS_KEY:-cutg-local-secret}'
      MINIO_API_CORS_ALLOW_ORIGIN: '${WEB_APP_URL:-http://localhost:3000}'
    ports:
      - '${S3_HOST_PORT:-9000}:9000'
      - '${S3_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barber-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "bucket=$${S3_BUCKET:-$${AWS_S3_BUCKET:-cutg-ai-local}};
      mc alias set local http://minio:9000
      $${S3_ACCESS_KEY_ID:-cutg-local} $${S3_SECRET_ACCESS_KEY:-cutg-local-secret};
      mc mb --ignore-existing local/$$bucket;
      mc anonymous set none local/$$bucket;"
    environment:
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-cutg-local}}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-cutg-local-secret}}'
      S3_BUCKET: '${S3_BUCKET:-}'
      AWS_S3_BUCKET: '${AWS_S3_BUCKET:-}'
    networks:
      - barber-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  barber-network:
    driver: bridge
