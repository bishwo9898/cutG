services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: barber_saas
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_password
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber_user -d barber_saas']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber-network

  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: barber_saas_test
      POSTGRES_USER: barber_test
      POSTGRES_PASSWORD: barber_test_password
    ports:
      - '${POSTGRES_TEST_HOST_PORT:-55434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber_test -d barber_saas_test']
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - barber-network

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber-network

volumes:
  postgres_data:
  redis_data:

networks:
  barber-network:
    driver: bridge
