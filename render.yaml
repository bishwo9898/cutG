previews:
  generation: off

# Zero-cost testing stack: one stateless API on Render. PostgreSQL is hosted separately on Neon's
# free tier, and durable images are hosted on Cloudinary's free tier. AI generation is deliberately
# disabled, so Redis, the Python AI API, private object storage, and an RQ worker are not provisioned.
services:
  - type: web
    name: cutg-api
    runtime: docker
    region: virginia
    plan: free
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN
        value: 0
      - key: DATABASE_POOL_MAX
        value: 3
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: WEB_APP_URL
        sync: false
      - key: MOBILE_APP_URL
        value: cutg://
      - key: ENABLE_ANALYTICS
        value: false
      - key: ENABLE_AI_FEATURES
        value: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: cutg-production
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BASIC_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false
